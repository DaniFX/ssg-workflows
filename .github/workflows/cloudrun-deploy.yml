name: "[Reusable] Go CI + Cloud Run Deploy"

# ──────────────────────────────────────────────────────────────
# Reusable workflow: Go vet/test → deploy to GCP Cloud Run
#
# DESIGN: env_vars per Cloud Run non possono essere passate come
# input (GitHub non espande secrets negli inputs). Vengono quindi
# iniettate direttamente tramite i secrets dichiarati qui sotto.
# Ogni servizio imposta solo i secrets che gli servono; quelli
# vuoti vengono ignorati automaticamente dallo step di deploy.
#
# Secrets obbligatori (tutti via `secrets: inherit`):
#   GCP_WORKLOAD_IDENTITY_PROVIDER
#   GCP_SERVICE_ACCOUNT_EMAIL
#
# Secrets opzionali — env vars Cloud Run:
#   GCP_PROJECT_ID, GCP_RUNTIME_SERVICE_ACCOUNT,
#   GATEWAY_URL, INTERNAL_SECRET, SERVICE_URL,
#   DOCUMENT_SERVICE_URL, FIREBASE_PROJECT_ID,
#   FIREBASE_WEB_API_KEY, ADMIN_EMAILS,
#   FIREBASE_STORAGE_BUCKET
# ──────────────────────────────────────────────────────────────
on:
  workflow_call:
    inputs:
      service_name:
        description: "Cloud Run service name (e.g. ssg-gateway)"
        required: true
        type: string
      go_version:
        description: "Go version"
        required: false
        type: string
        default: "1.22"
      region:
        description: "GCP region"
        required: false
        type: string
        default: "europe-west8"
      ingress_flag:
        description: "--ingress flag value"
        required: false
        type: string
        default: "--ingress=internal-and-cloud-load-balancing"
      extra_flags:
        description: "Additional Cloud Run deploy flags"
        required: false
        type: string
        default: ""
    secrets:
      # ── Auth (obbligatori) ───────────────────────────────────
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT_EMAIL:
        required: true
      # ── Runtime SA del servizio (opzionale) ─────────────────
      GCP_RUNTIME_SERVICE_ACCOUNT:
        required: false
      # ── Env vars Cloud Run (opzionali) ─────────────────────
      GCP_PROJECT_ID:
        required: false
      FIREBASE_PROJECT_ID:
        required: false
      FIREBASE_WEB_API_KEY:
        required: false
      FIREBASE_STORAGE_BUCKET:
        required: false
      ADMIN_EMAILS:
        required: false
      GATEWAY_URL:
        required: false
      SERVICE_URL:
        required: false
      INTERNAL_SECRET:
        required: false
      DOCUMENT_SERVICE_URL:
        required: false

jobs:
  # ── 1. CI: vet + test ──────────────────────────────────────
  ci:
    name: Go CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go ${{ inputs.go_version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race -timeout 120s

  # ── 2. Deploy (solo se CI verde) ───────────────────────────
  deploy:
    name: Deploy → Cloud Run (${{ inputs.service_name }})
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cloudrun-deploy-${{ inputs.service_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      # Costruisce la stringa env_vars solo con i secrets non vuoti.
      # deploy-cloudrun accetta KEY=value separati da virgola.
      - name: Build env_vars string
        id: envvars
        shell: bash
        env:
          GCP_PROJECT_ID:        ${{ secrets.GCP_PROJECT_ID }}
          FIREBASE_PROJECT_ID:   ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_API_KEY:  ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          ADMIN_EMAILS:          ${{ secrets.ADMIN_EMAILS }}
          GATEWAY_URL:           ${{ secrets.GATEWAY_URL }}
          SERVICE_URL:           ${{ secrets.SERVICE_URL }}
          INTERNAL_SECRET:       ${{ secrets.INTERNAL_SECRET }}
          DOCUMENT_SERVICE_URL:  ${{ secrets.DOCUMENT_SERVICE_URL }}
        run: |
          vars=()
          [ -n "$GCP_PROJECT_ID" ]         && vars+=("ENV=production")
          [ -n "$GCP_PROJECT_ID" ]         && vars+=("GOOGLE_CLOUD_PROJECT=$GCP_PROJECT_ID")
          [ -n "$FIREBASE_PROJECT_ID" ]    && vars+=("FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID")
          [ -n "$FIREBASE_WEB_API_KEY" ]   && vars+=("FIREBASE_WEB_API_KEY=$FIREBASE_WEB_API_KEY")
          [ -n "$FIREBASE_STORAGE_BUCKET" ] && vars+=("FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET")
          [ -n "$ADMIN_EMAILS" ]           && vars+=("ADMIN_EMAILS=$ADMIN_EMAILS")
          [ -n "$GATEWAY_URL" ]            && vars+=("GATEWAY_URL=$GATEWAY_URL")
          [ -n "$SERVICE_URL" ]            && vars+=("SERVICE_URL=$SERVICE_URL")
          [ -n "$INTERNAL_SECRET" ]        && vars+=("INTERNAL_SECRET=$INTERNAL_SECRET")
          [ -n "$DOCUMENT_SERVICE_URL" ]   && vars+=("DOCUMENT_SERVICE_URL=$DOCUMENT_SERVICE_URL")
          # Unisce con virgola
          result=$(IFS=','; echo "${vars[*]}")
          echo "result=$result" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ inputs.service_name }}
          region:  ${{ inputs.region }}
          source:  .
          flags: >
            --port=8080
            ${{ inputs.ingress_flag }}
            ${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT != '' && format('--service-account={0}', secrets.GCP_RUNTIME_SERVICE_ACCOUNT) || '' }}
            ${{ inputs.extra_flags }}
          env_vars: ${{ steps.envvars.outputs.result }}
